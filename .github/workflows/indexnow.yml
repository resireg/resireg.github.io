name: IndexNow ping

# Notify IndexNow-participating search engines (Bing, Yandex, Naver, Seznam, Yep)
# that the page changed. Runs after every successful GitHub Pages build and can
# also be triggered by hand from the Actions tab.
on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_HOST: resireg.github.io
  # Must match the key file committed at the repository root.
  KEY_FILE: 0ae775d90c479ae91b183b1b8b0bbbd4.txt

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the deployed key file is live
        run: |
          KEY="${KEY_FILE%.txt}"
          URL="https://${SITE_HOST}/${KEY_FILE}"
          for i in $(seq 1 30); do
            BODY="$(curl -fsS "$URL" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$BODY" = "$KEY" ]; then
              echo "Key file is live at $URL"
              exit 0
            fi
            echo "Attempt $i: key file not yet served, retrying in 10s"
            sleep 10
          done
          echo "::error::Key file never became reachable at $URL"
          exit 1

      - name: Submit URL to IndexNow
        run: |
          KEY="${KEY_FILE%.txt}"
          PAYLOAD=$(cat <<EOF
          {
            "host": "${SITE_HOST}",
            "key": "${KEY}",
            "keyLocation": "https://${SITE_HOST}/${KEY_FILE}",
            "urlList": ["https://${SITE_HOST}/"]
          }
          EOF
          )
          STATUS=$(curl -sS -o /tmp/indexnow_response.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD")
          echo "IndexNow responded with HTTP $STATUS"
          cat /tmp/indexnow_response.txt || true
          case "$STATUS" in
            200|202) exit 0 ;;
            *) echo "::error::IndexNow rejected the submission (HTTP $STATUS)"; exit 1 ;;
          esac
